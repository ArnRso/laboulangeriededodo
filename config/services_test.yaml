services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Les services applicatifs sans consommateur sont inlinés à la compilation :
    # on les conserve accessibles pour pouvoir les récupérer dans les tests.
    App\Service\UnlockService:
        public: true

    App\Service\InvitationService:
        public: true

    App\Service\InvitationMailer:
        public: true
        arguments:
            $senderAddress: '%app.mail.sender_address%'
            $senderName: '%app.mail.sender_name%'

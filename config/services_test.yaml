services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Les services applicatifs sans consommateur sont inlinés à la compilation :
    # on les conserve accessibles pour pouvoir les récupérer dans les tests.
    App\Service\:
        resource: '../src/Service/'
        exclude:
            - '../src/Service/NotificationState.php'
            - '../src/Service/FeedOverview.php'
            - '../src/Service/Dressing/AppField.php'
            - '../src/Service/Dressing/Source.php'
            - '../src/Service/Dressing/FieldMapping.php'
            - '../src/Service/Dressing/DressMapping.php'
        public: true

    App\Service\InvitationMailer:
        public: true
        arguments:
            $senderAddress: '%app.mail.sender_address%'
            $senderName: '%app.mail.sender_name%'
            $replyToAddress: '%app.mail.reply_to%'
